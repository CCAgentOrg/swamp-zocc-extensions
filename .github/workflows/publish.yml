name: Publish Extensions

on:
  push:
    branches: [main]
    paths:
      - 'datastore/*/manifest.yaml'
      - 'model/*/manifest.yaml'
      - 'vault/*/manifest.yaml'
  workflow_dispatch:

jobs:
  publish:
    name: Publish extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: systeminit/setup-swamp@v0.1.0
        with:
          api-key: ${{ secrets.SWAMP_PUBLISH_TOKEN }}
      - name: Publish extensions
        run: |
          # Determine which extensions to publish
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MANIFESTS=$(git ls-files '*/*/manifest.yaml')
          elif git rev-parse HEAD~1 &>/dev/null; then
            MANIFESTS=$(git diff --name-only --diff-filter=d HEAD~1 HEAD -- '*/*/manifest.yaml')
          else
            MANIFESTS=$(git ls-files '*/*/manifest.yaml')
          fi

          if [ -z "$MANIFESTS" ]; then
            echo "No changed manifests found"
            exit 0
          fi

          echo "Extensions to process:"
          echo "$MANIFESTS"
          echo ""

          PUBLISHED=0
          SKIPPED=0
          FAILED=0

          for manifest in $MANIFESTS; do
            dir=$(dirname "$manifest")
            cd "$GITHUB_WORKSPACE/$dir"

            NAME=$(grep '^name:' manifest.yaml | head -1 | sed 's/name:[[:space:]]*"\(.*\)"/\1/; s/name:[[:space:]]*\(.*\)/\1/')
            LOCAL=$(grep '^version:' manifest.yaml | head -1 | sed 's/version:[[:space:]]*"\(.*\)"/\1/; s/version:[[:space:]]*\(.*\)/\1/')
            UPSTREAM=$(swamp extension version "$NAME" --json 2>/dev/null | jq -r '.currentPublished // empty' || true)

            if [ "$LOCAL" = "$UPSTREAM" ]; then
              echo "skip: $NAME ($LOCAL) already published"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ ! -f .swamp.yaml ]; then
              swamp repo init --quiet --tool none
            fi

            echo "Publishing $NAME ($LOCAL)..."
            if swamp extension push manifest.yaml --yes 2>&1; then
              PUBLISHED=$((PUBLISHED + 1))
              echo "=> Published $NAME@$LOCAL"
            else
              echo "=> Failed to publish $NAME"
              FAILED=$((FAILED + 1))
            fi

            sleep 1
          done

          echo ""
          echo "Results: $PUBLISHED published, $SKIPPED skipped, $FAILED failed"

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
