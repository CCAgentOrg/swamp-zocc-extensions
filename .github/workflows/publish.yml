name: Publish Extensions

on:
  push:
    branches: [main]
    paths:
      - 'datastore/*/manifest.yaml'
      - 'model/*/manifest.yaml'
      - 'vault/*/manifest.yaml'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changed extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Find changed manifests
        run: |
          CHANGED=""
          if git rev-parse HEAD~1 &>/dev/null; then
            for manifest in $(git diff --name-only --diff-filter=d HEAD~1 HEAD -- '*/*/manifest.yaml'); do
              dir=$(dirname "$manifest")
              CHANGED="${CHANGED}${dir}\n"
            done
          else
            # Initial commit or workflow_dispatch — publish all
            for manifest in $(git ls-files '*/*/manifest.yaml'); do
              dir=$(dirname "$manifest")
              CHANGED="${CHANGED}${dir}\n"
            done
          fi

          if [ -z "$CHANGED" ]; then
            echo "No changed manifests found"
            echo "changed=" >> "$GITHUB_OUTPUT"
          else
            # Deduplicate and write to file for multiline safety
            echo -e "$CHANGED" | sort -u > /tmp/changed_dirs.txt
            echo "Changed extensions:"
            cat /tmp/changed_dirs.txt
            echo "changed=$(cat /tmp/changed_dirs.txt)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish extensions
    needs: detect-changes
    if: needs.detect-changes.outputs.changed != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: systeminit/setup-swamp@v0.1.0
        with:
          api-key: ${{ secrets.SWAMP_PUBLISH_TOKEN }}
      - name: Publish extensions
        run: |
          PUBLISHED=0
          SKIPPED=0
          FAILED=0

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            cd "$GITHUB_WORKSPACE/$dir"

            NAME=$(grep '^name:' manifest.yaml | sed 's/name: *"\(.*\)"/\1/')
            LOCAL=$(grep '^version:' manifest.yaml | sed 's/version: *"\(.*\)"/\1/')
            UPSTREAM=$(swamp extension version "$NAME" --json 2>/dev/null | jq -r '.currentPublished // empty' || true)

            if [ "$LOCAL" = "$UPSTREAM" ]; then
              echo "skip: $NAME ($LOCAL) already published"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Ensure swamp repo marker exists
            if [ ! -f .swamp.yaml ]; then
              swamp repo init --quiet --tool none
            fi

            echo "Publishing $NAME ($LOCAL)..."
            if swamp extension push manifest.yaml --yes 2>&1; then
              PUBLISHED=$((PUBLISHED + 1))
              echo "✓ Published $NAME@$LOCAL"
            else
              echo "✗ Failed to publish $NAME"
              FAILED=$((FAILED + 1))
            fi

            sleep 1
          done < /tmp/changed_dirs.txt

          echo ""
          echo "Results: $PUBLISHED published, $SKIPPED skipped, $FAILED failed"

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
